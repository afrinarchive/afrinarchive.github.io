const L=[...document.querySelectorAll('.vl')].map(g=>({g,i:+g.dataset.i,x:+g.dataset.x,y:+g.dataset.y,b:g.dataset.b.split(',').map(Number),r:+g.dataset.r,town:!!g.querySelector('text.t')})).sort((a,b)=>a.r-b.r);
const AR={},LB={};document.querySelectorAll('.ar').forEach(a=>AR[a.dataset.g]=a);L.forEach(l=>LB[l.i]=l.g);
let raf=0;
// Every name is always shown. The seven main towns stay large on screen when zoomed out, even over other names.
function layout(){raf=0;const sc=s.getScreenCTM().a,px=57*sc,k=px>32?32/px:1,t=Math.max(k,24/(84*sc));
 for(const l of L)l.g.setAttribute('transform',`translate(${l.x} ${l.y}) scale(${(l.town?t:k).toFixed(3)})`)}
const set=()=>{s.setAttribute('viewBox',[v.x,v.y,v.w,v.h].join(' '));if(!raf)raf=requestAnimationFrame(layout)};
const pt=(x,y)=>{const p=new DOMPoint(x,y).matrixTransform(s.getScreenCTM().inverse());return[p.x,p.y]};
function zoom(f,cx,cy){const nw=Math.min(W0*2.2,Math.max(350,v.w/f));f=v.w/nw;v={x:cx-(cx-v.x)/f,y:cy-(cy-v.y)/f,w:nw,h:v.h/f};set()}
function home(){v={x:0,y:130,w:W0,h:H0};set()}
addEventListener('resize',set);
s.addEventListener('wheel',e=>{if(EMBED&&!e.ctrlKey&&!e.metaKey){try{parent.scrollBy(0,e.deltaY)}catch(_){}return}e.preventDefault();const[x,y]=pt(e.clientX,e.clientY);zoom(Math.exp(-e.deltaY*.0016),x,y)},{passive:false});
// hover
// cur is the village under the pointer, or -1; curG the lit area
let cur=-1,curG=-1;
function light(i,g){if(i===cur&&g===curG)return;
 if(curG>=0){AR[curG].classList.remove('on');GG[curG][0].forEach(x=>LB[x].classList.remove('on'))}if(cur>=0)LB[cur].classList.remove('on');
 cur=i;curG=g;if(g>=0){AR[g].classList.add('on');if(i<0)GG[g][0].forEach(x=>LB[x].classList.add('on'))}if(i>=0)LB[i].classList.add('on')}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const names=a=>a.map(x=>esc(VV[x][0])).join(', ');
const open_=x=>`<a href="https://www.afrinarchive.com/village_sites/${encodeURIComponent(VV[x][2])}.html" target="_blank" rel="noopener">${esc(VV[x][0])}</a>`;
function text(i,g,card){
 if(i<0){const[a,x]=GG[g];if(a.length===1)i=a[0];else return `<b>${names(a)}</b>The book draws one area for these villages.<br>`+(x.length?`Also in this area: ${names(x)}<br>`:'')+(card?a.map(open_).join(' '):'<em>Click to choose one</em>')}
 const[n,d,l,al,gi,ins]=VV[i];let h=`<b>${esc(n)}</b>`;if(al.length)h+=`<i>${al.slice(0,4).map(esc).join(', ')}</i><br>`;if(d)h+=`District of ${esc(d)}<br>`;
 if(gi>=0){const o=GG[gi][0].filter(x=>x!==i);if(o.length)h+=`The book draws one area for it and ${names(o)}<br>`;if(GG[gi][1].length)h+=`Also in this area: ${names(GG[gi][1])}<br>`}
 else if(ins>=0)h+=`In the area of ${names(GG[ins][0])}<br>`;
 return h+(card?`<a href="https://www.afrinarchive.com/village_sites/${encodeURIComponent(l)}.html" target="_blank" rel="noopener">Open village page</a>`:'<em>Click to open its page</em>')}
const pick=o=>o.dataset.g!==undefined?[-1,+o.dataset.g]:[+o.dataset.i,VV[+o.dataset.i][4]];
function place(x,y){tip.classList.remove('card');tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(x+18,innerWidth-w-8)+'px';tip.style.top=(y+20+h>innerHeight?y-h-14:y+20)+'px'}
function hide(){PIN?light(...PIN):light(-1,-1);tip.style.display='none'}
function at(e){const o=e.target.closest&&e.target.closest('[data-i],[data-g],[data-t]');return o}
s.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||P.size)return;const o=at(e);if(tip.classList.contains('card')&&tip.style.display==='block'){if(!o||o.dataset.g!==undefined&&+o.dataset.g===curG)return;tip.classList.remove('card');light(-1,-1)}if(!o)return hide();
 if(o.dataset.t!==undefined){light(-1,-1);const[a,b]=o.dataset.t.split('|');tip.innerHTML=`<b>${esc(a)}</b>${esc(b)}`}else{const[i,g]=pick(o);if(i!==cur||g!==curG)tip.innerHTML=text(i,g);light(i,g)}
 place(e.clientX,e.clientY)});
s.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!tip.classList.contains('card'))hide()});
s.addEventListener('focusin',e=>{const g=e.target.querySelector&&e.target.querySelector('[data-i]');if(g&&e.target.matches(':focus-visible')){const[i,k]=pick(g);light(i,k);tip.innerHTML=text(i,k);const r=g.getBoundingClientRect();place(r.right,r.top)}});
// drag, pinch, tap
const P=new Map();let moved=0,dist=0,touch=false;
s.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;dist=0;touch=e.pointerType!=='mouse'});
addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=[e.clientX,e.clientY];
 if(P.size===1){const a=pt(...o),b=pt(...n);moved+=Math.hypot(n[0]-o[0],n[1]-o[1]);if(moved>4){s.classList.add('drag');tip.style.display='none'}v.x-=b[0]-a[0];v.y-=b[1]-a[1];set()}
 P.set(e.pointerId,n);
 if(P.size===2){const[a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);moved=9;if(dist){const[x,y]=pt((a[0]+b[0])/2,(a[1]+b[1])/2);zoom(d/dist,x,y)}dist=d}});
for(const t of['pointerup','pointercancel'])addEventListener(t,e=>{P.delete(e.pointerId);dist=0;s.classList.remove('drag')});
s.addEventListener('dragstart',e=>e.preventDefault());
s.addEventListener('click',e=>{if(moved>6){e.preventDefault();return}
 const o=at(e),many=o&&o.dataset.g!==undefined&&GG[+o.dataset.g][0].length>1;if(!touch&&!many)return;e.preventDefault();if(!o)return hide();tip.className='card';tip.style.display='block';
 if(o.dataset.t!==undefined){light(-1,-1);const[a,b]=o.dataset.t.split('|');tip.innerHTML=`<b>${esc(a)}</b>${esc(b)}`}else{const[i,g]=pick(o);light(i,g);tip.innerHTML=text(i,g,true)}},true);
document.querySelectorAll('#z button').forEach(b=>b.onclick=()=>{const f=+b.dataset.f;f?zoom(f,v.x+v.w/2,v.y+v.h/2):home()});
document.querySelectorAll('[data-l]').forEach(c=>c.onchange=()=>document.getElementById('L-'+c.dataset.l).classList.toggle('off',!c.checked));
home();
// Village search: the result under the pointer or arrow keys is lit on the map; Enter or a click zooms to it.
(()=>{const inp=document.getElementById('fsi'),ul=document.getElementById('fsl');let res=[],sel=-1;
 const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'');
 const ix=VV.map((r,i)=>({i,keys:[r[0],r[2],...r[3]].map(norm)}));
 function pick(k,zoom){sel=k;[...ul.children].forEach((li,j)=>li.classList.toggle('sel',j===k));if(k<0)return;const i=res[k];pinVillage(i);
  if(zoom){const l=L.find(x=>x.i===i);const w=Math.min(v.w,1400),h=w*v.h/v.w;v={x:l.x-w/2,y:l.y-h/2,w,h};set();ul.style.display='none';inp.blur()}}
 inp.addEventListener('input',()=>{const q=norm(inp.value);sel=-1;
  res=q?ix.map(o=>{const s=Math.min(...o.keys.map(k=>k===q?0:k.startsWith(q)?1:k.includes(q)?2:9));return[s,o.i]}).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||VV[a[1]][0].localeCompare(VV[b[1]][0])).slice(0,12).map(a=>a[1]):[];
  ul.innerHTML=res.map(i=>`<li role="option"><b>${esc(VV[i][0])}</b><small>${esc([VV[i][1]&&'District of '+VV[i][1],VV[i][3].slice(0,2).join(', ')].filter(Boolean).join(' · '))}</small></li>`).join('')||(q?'<li><small>No village found</small></li>':'');
  ul.style.display=q?'block':'none';if(!q)pinVillage(-1);else if(res.length)pick(0,false)});
 ul.addEventListener('mousemove',e=>{const li=e.target.closest('li'),k=[...ul.children].indexOf(li);if(k>=0&&k!==sel&&res[k]!==undefined)pick(k,false)});
 ul.addEventListener('click',e=>{const k=[...ul.children].indexOf(e.target.closest('li'));if(res[k]!==undefined)pick(k,true)});
 inp.addEventListener('keydown',e=>{if(!res.length)return;if(e.key==='ArrowDown'){e.preventDefault();pick((sel+1)%res.length,false)}else if(e.key==='ArrowUp'){e.preventDefault();pick((sel-1+res.length)%res.length,false)}else if(e.key==='Enter'){pick(Math.max(sel,0),true)}else if(e.key==='Escape'){ul.style.display='none'}});
 inp.addEventListener('focus',()=>{if(inp.value)ul.style.display='block'});
})();
// ?district=<name> zooms to a district; ?focus=<village page name> zooms to its district and keeps the village lit.
// Pages that hold this map in a frame call AfrinMap.show(<village page name>) to light another village.
function zoomDistrict(code){const b=DB[code];if(!b)return;const pad=120;v={x:b[0]-pad,y:b[1]-pad,w:b[2]-b[0]+2*pad,h:b[3]-b[1]+2*pad};set()}
function pinVillage(i){if(PIN){if(PIN[1]>=0)AR[PIN[1]].classList.remove('pin');const c=LB[PIN[0]].querySelector('.ch');c.removeAttribute('r');c.setAttribute('r',LB[PIN[0]].querySelector('circle:not(.ch)').getAttribute('r')*1+16);c.classList.remove('pinch');LB[PIN[0]].classList.remove('pinl');PIN=null;light(-1,-1)}
 if(i<0)return;PIN=[i,VV[i][4]];light(...PIN);if(PIN[1]>=0)AR[PIN[1]].classList.add('pin');const c=LB[i].querySelector('.ch');c.setAttribute('r',60);c.classList.add('pinch');LB[i].classList.add('pinl')}
window.AfrinMap={show(page){pinVillage(VV.findIndex(r=>r[2]===page))}};
// The same request sent as a message works even when pages are opened from a folder.
addEventListener('message',e=>{if(e.data&&typeof e.data.afrinShow==='string')AfrinMap.show(e.data.afrinShow)});
(()=>{const q=new URLSearchParams(location.search),d=q.get('district'),f=q.get('focus');
 if(d){const code=Object.keys(DNAME).find(k=>DNAME[k]===d);if(code)zoomDistrict(code)}
 if(f){const i=VV.findIndex(r=>r[2]===f);if(i<0)return;if(!d)zoomDistrict(VV[i][6]);pinVillage(i)}})();
</script></body></html>
