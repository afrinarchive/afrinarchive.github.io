name: Update homepage articles

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: update-articles

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            /index.html
            /scripts/latest_substack_articles.py
          sparse-checkout-cone-mode: false

      - name: Update the article slider
        run: python3 -X utf8 scripts/latest_substack_articles.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "The homepage already shows the newest articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update homepage articles"
          if ! git push; then
            echo "The site was uploaded at the same moment. Tomorrow's run will add the articles."
            exit 0
          fi
          # A change made here does not start publish.yml by itself, so start it.
          for pause in 10 30 60 300 900; do
            gh workflow run publish.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep $pause
          done
          gh workflow run publish.yml --ref main -R "$GITHUB_REPOSITORY"
